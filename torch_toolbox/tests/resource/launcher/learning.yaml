config_type: supervised_Config
object_type: learning
max_iters: 10
model: file@./model.yaml
mode:
  train:
    use_grad: true
    loader:
      batch_size: 4
      dataset_meta:
        config_type: COCO_Dataset_Config
    batch_monitoring:
      - scalar
  val:
    loader:
      batch_size: ${learning.mode.train.loader.batch_size}
      dataset_meta:
        config_type: COCO_Dataset_Config
