config_type: supervised_Config
object_type: learning
max_iters: 3
save_interval: 1
log:
  level: INFO
  output:
    - format: json
      to: events.jsonl
model: file@./model.yaml
loss: file@./loss.yaml
optim: file@./optim.yaml
mode:
  train:
    use_grad: true
    loader:
      batch_size: 8
      dataset_meta:
        config_type: toy_dataset_Config
        data_kwargs: {size: 64, classes: "${learning.model.classes}", seed: 0}
    metric:
      scalar: {object_type: scalar_accumulator}
  val:
    loader:
      batch_size: 16
      shuffle: false
      dataset_meta:
        config_type: toy_dataset_Config
        data_kwargs: {size: 32, classes: "${learning.model.classes}", seed: 1}
    metric:
      scalar: {object_type: scalar_accumulator}
  test:
    loader:
      batch_size: 16
      shuffle: false
      dataset_meta:
        config_type: toy_dataset_Config
        data_kwargs: {size: 32, classes: "${learning.model.classes}", seed: 2}
    metric:
      scalar: {object_type: scalar_accumulator}
